<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimposta Password — CardPioneer Admin</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #1a0a2e;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .box {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%; max-width: 380px;
      text-align: center;
    }
    .icon { font-size: 40px; margin-bottom: 14px; }
    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 18px; color: #fff; margin-bottom: 8px; letter-spacing: -.02em;
    }
    p { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 24px; line-height: 1.6; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px; color: #fff; font-size: 13px; outline: none;
      font-family: inherit;
    }
    input:focus { border-color: #f5e642; }
    button {
      width: 100%; padding: 13px;
      font-family: 'Unbounded', sans-serif; font-size: 11px; font-weight: 700;
      background: #f5e642; color: #1a0a2e; border: none;
      border-radius: 8px; cursor: pointer; margin-top: 6px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { font-size: 12px; margin-top: 12px; display: none; text-align: left; }
    .msg.error { color: #f87171; }
    .msg.success { color: #34d399; }
  </style>
</head>
<body>

  <div class="box">
    <div class="icon">🔑</div>
    <h1>Reimposta password</h1>
    <p>Inserisci la nuova password per il tuo account admin CardPioneer.</p>

    <div id="formBox">
      <input type="password" id="newPwd" placeholder="Nuova password (min. 8 caratteri)">
      <input type="password" id="confirmPwd" placeholder="Conferma password">
      <button onclick="updatePassword()" id="submitBtn">Salva nuova password</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="successBox" style="display:none">
      <div class="msg success" style="display:block;text-align:center">
        ✅ Password aggiornata con successo!
      </div>
      <a href="admin.html" style="display:inline-block;margin-top:16px;color:#f5e642;font-size:13px;text-decoration:none">
        → Vai al pannello admin
      </a>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://nzjwpdbljfwrspmepoqo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56andwZGJsamZ3cnNwbWVwb3FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjM3OTIsImV4cCI6MjA5NTkzOTc5Mn0.-pYvXNjs-63OszfdMbdjiD2Harvgvl9L1D9UjgXa_Gs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.style.display = 'block';
  m.className = 'msg ' + type;
  m.textContent = text;
}

async function updatePassword() {
  const pwd     = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  const btn     = document.getElementById('submitBtn');

  if (pwd.length < 8) { showMsg('La password deve avere almeno 8 caratteri.', 'error'); return; }
  if (pwd !== confirm) { showMsg('Le password non coincidono.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '⏳ Salvataggio...';

  const { error } = await sb.auth.updateUser({ password: pwd });

  if (error) {
    showMsg('Errore: ' + error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Salva nuova password';
    return;
  }

  document.getElementById('formBox').style.display = 'none';
  document.getElementById('successBox').style.display = 'block';
}

// Supabase gestisce automaticamente il token dal link email
// tramite onAuthStateChange — verifica sessione attiva
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Sessione di recovery attiva, pronto per updateUser
  }
});
</script>
</body>
</html>
